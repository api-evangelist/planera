name: Planera
description: 'Planera is a modern construction scheduling platform for builders and
  general contractors, purpose-built around the Critical Path Method (CPM). It lets
  teams build, manage, and optimize project schedules through a visual, collaborative
  interface with drag-and-drop editing, a digital whiteboard (Canvas), Gantt views,
  DCMA quality checks, resource planning, and an AI scheduling assistant (Manny) for
  scenario analysis and risk identification. Planera spans pursuits, preconstruction,
  operations, and enterprise portfolio management, offers an iPad field app, and integrates
  with Procore, Autodesk, Primavera P6, and Microsoft Project. The company is SOC 2
  Type 2 and SOC 3 certified and is backed by Sierra Ventures.'
